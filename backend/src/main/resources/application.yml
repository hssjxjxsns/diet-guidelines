server:
  port: ${PORT:9000}
  servlet:
    context-path: /api

spring:
  application:
    name: diet-guide-server
  datasource:
    # 内置文件数据库：数据落在 ./data/diet-guide.mv.db，无需安装任何数据库服务
    url: ${DATABASE_URL:jdbc:h2:file:./data/diet-guide;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;NON_KEYWORDS=KEY}
    driver-class-name: org.h2.Driver
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:seed.sql
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    chat-model: ${ZHIPU_CHAT_MODEL:glm-5.3-flash}
    embedding-model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
    max-retries: ${AI_MAX_RETRIES:1}

logging:
  level:
    com.dietguide: info
